name: Statistics Service Coverage

on:
  pull_request:
    paths:
      - 'statistics-service/**'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo
        run: |
          cd statistics-service
          ./mvnw clean test

      - name: Check coverage on modified files
        run: |
          cd statistics-service
          MODIFIED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep "statistics-service/src/main/java" | sed 's|statistics-service/src/main/java/||' | sed 's/\.java$//')
          
          if [ -z "$MODIFIED_FILES" ]; then
            echo "No modified Java files in statistics-service to check coverage for."
            exit 0
          fi

          echo "Modified files to check coverage for:"
          echo "$MODIFIED_FILES"

          TOTAL_MISSED=0
          TOTAL_COVERED=0

          while read -r file; do
            # MODIFIED_FILES is e.g. com/timeline/stats/service/StatsService
            CLASSNAME=$(basename "$file")
            
            # Simple grep/awk to extract coverage from jacoco.csv
            # jacoco.csv format: GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,...
            # We use ,$CLASSNAME, to match the exact class name in the 3rd field
            
            MISSED=$(grep ",$CLASSNAME," target/jacoco-report/jacoco.csv | cut -d',' -f4 | awk '{sum+=$1} END {print sum}')
            COVERED=$(grep ",$CLASSNAME," target/jacoco-report/jacoco.csv | cut -d',' -f5 | awk '{sum+=$1} END {print sum}')
            
            if [ -n "$MISSED" ] && [ -n "$COVERED" ]; then
              TOTAL_MISSED=$((TOTAL_MISSED + MISSED))
              TOTAL_COVERED=$((TOTAL_COVERED + COVERED))
              
              FILE_TOTAL=$((MISSED + COVERED))
              if [ $FILE_TOTAL -gt 0 ]; then
                FILE_PERC=$(echo "scale=2; $COVERED * 100 / $FILE_TOTAL" | bc)
                echo "Class: $CLASSNAME - Coverage: $FILE_PERC%"
              fi
            else
              echo "Warning: Could not find coverage data for $CLASSNAME"
            fi
          done <<< "$MODIFIED_FILES"

          if [ $((TOTAL_MISSED + TOTAL_COVERED)) -eq 0 ]; then
            echo "No coverage data found for modified files."
            exit 0
          fi

          TOTAL_PERC=$(echo "scale=2; $TOTAL_COVERED * 100 / ($TOTAL_MISSED + TOTAL_COVERED)" | bc)
          echo "Overall Coverage for modified files: $TOTAL_PERC%"

          if (( $(echo "$TOTAL_PERC < 70" | bc -l) )); then
            echo "Error: Coverage for modified files is below 70% ($TOTAL_PERC%)"
            exit 1
          fi

          echo "Coverage check passed!"
