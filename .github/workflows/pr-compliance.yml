name: PR Compliance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, milestoned, demilestoned]

jobs:
  compliance:
    name: Compliance Check
    # Solo ejecutar cuando el PR NO sea un borrador (draft)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get all changed files
        id: all-changed-files
        uses: tj-actions/changed-files@v45

      - name: Check CHANGELOG.md update
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: CHANGELOG.md

      - name: Validate CHANGELOG.md and Milestone
        env:
          CHANGED_COUNT: ${{ steps.all-changed-files.outputs.all_changed_count }}
          CHANGELOG_CHANGED: ${{ steps.changed-files.outputs.any_changed }}
          MILESTONE: ${{ github.event.pull_request.milestone.number }}
        run: |
          echo "Total changed files: $CHANGED_COUNT"
          echo "Is CHANGELOG changed?: $CHANGELOG_CHANGED"
          echo "Milestone present: ${MILESTONE:-None}"

          # 1. Validación de Milestone (Obligatorio para todos)
          if [ -z "$MILESTONE" ]; then
            echo "::error::El PR debe tener un Milestone asignado cuando está listo para revisión."
            exit 1
          fi

          # 2. Validación de CHANGELOG (Solo si >= 3 archivos)
          if [ "$CHANGED_COUNT" -ge 3 ]; then
            if [ "$CHANGELOG_CHANGED" = "false" ]; then
              echo "::error file=CHANGELOG.md::CHANGELOG.md debe estar actualizado para PRs con 3 o más archivos."
              echo "Error: CHANGELOG.md no ha sido modificado en un PR de $CHANGED_COUNT archivos."
              exit 1
            fi
          else
            echo "Saltando validación de CHANGELOG (menos de 3 archivos)."
          fi
