services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo

  stats:
    build: ./statistics-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - mongo

  frontend-v2:
    build: ./frontend-v2
    ports:
      - "3002:3002"
    depends_on:
      - backend
      - stats

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local