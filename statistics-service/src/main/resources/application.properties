# Application Configuration
quarkus.application.name=statistics-service

# HTTP Configuration
quarkus.http.port=8081
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3002,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# MongoDB Configuration
quarkus.mongodb.connection-string=${MONGO_CONNECTION_STRING}
quarkus.mongodb.database=${MONGO_DATABASE}
quarkus.mongodb.read-preference=primaryPreferred

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.timeline".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Health Check
quarkus.smallrye-health.root-path=/health

# Dev Services (disable auto MongoDB container in dev mode)
quarkus.mongodb.devservices.enabled=false
